const sectors=[{name:"Healthcare & Pharma",gdpPct:17.6,disruptionScore:9.2,unemploymentRisk:7.0,gdpImpact:7.5,jobsAtRisk:"4.2",emoji:"\u{1F3E5}",color:"#FF6B6B",currentState:"Largest single sector. Heavily regulated, fragmented, data-rich but siloed. $4.5T annual spend in the US alone.",jobsNote:"Admin and revenue cycle roles (coders, billers, prior auth staff) face 40-60% displacement. Clinical roles shift rather than disappear — radiologists become AI supervisors, not obsolete. Net job loss concentrated in back-office, partially offset by new roles in health tech.",gdpNote:"Massive GDP upside. AI-driven drug discovery accelerates new treatments to market. Admin cost reduction ($300B+ waste layer) flows to either margins or expanded access. Diagnostic accuracy improvements reduce costly misdiagnoses.",disruptions:[{area:"Drug Discovery",impact:"high",desc:"AI compressing 10-year R&D timelines to 2-3 years."},{area:"Diagnostics & Imaging",impact:"high",desc:"AI reading scans at or above physician-level accuracy."},{area:"Clinical Documentation",impact:"high",desc:"Ambient AI scribes eliminating hours of daily charting."},{area:"Admin & Revenue Cycle",impact:"high",desc:"Claims processing, denial management — the $300B+ waste layer."},{area:"Personalized Treatment",impact:"medium",desc:"Genomic data + AI enabling precision dosing at scale."}],opportunities:"Health tech platforms, clinical decision support, pharma services, healthcare data infrastructure, consumer health AI tools.",timeframe:"Already underway — accelerating through 2027"},{name:"Professional & Business Services",gdpPct:13.1,disruptionScore:9.5,unemploymentRisk:9.5,gdpImpact:3.0,jobsAtRisk:"5.5",emoji:"\u{1F4BC}",color:"#4ECDC4",currentState:"Consulting, legal, accounting, marketing, staffing — the knowledge work economy. $1.8T+ sector built on human expertise sold by the hour.",jobsNote:"The most exposed white-collar sector. Junior associates, analysts, paralegals, copywriters, bookkeepers face 50-70% rs face near-term displacement. Property management admin and leasing agents at moderate risk. Physical maintenance labor unaffected.",gdpNote:"Modest impact. Real estate GDP driven by asset values and construction — neither fundamentally changed by AI. Bigger impact is indirect via remote work reshaping geography.",disruptions:[{area:"Valuations & Appraisals",impact:"high",desc:"AI-powered automated valuation models becoming standard."},{area:"Property Management",impact:"medium",desc:"AI handling tenant comms, maintenance, lease optimization."},{area:"Brokerage & Transactions",impact:"medium",desc:"Lead gen, matching, virtual tours, doc prep."},{area:"Commercial Underwriting",impact:"medium",desc:"AI analyzing market data and deal structures."},{area:"Smart Buildings",impact:"low",desc:"AI-controlled HVAC, lighting, security."}],opportunities:"PropTech platforms, AI property management, smart buildings, real estate analytics.",timeframe:"Gradual — AI augments but doesn’t replace physical dynamics"},{name:"Manufacturing",gdpPct:10.8,disruptionScore:7.5,unemploymentRisk:6.5,gdpImpact:6.0,jobsAtRisk:"2.8",emoji:"\u{1F3ED}",color:"#DDA0DD",currentState:"Already heavily automated. AI adds the intelligence layer — predictive, adaptive, autonomous decision-making.",jobsNote:"Quality inspectors and repetitive-line operators most at risk. But manufacturing already absorbed decades of automation. Reshoring could create net new US jobs.",gdpNote:"One of the biggest GDP winners. Predictive maintenance reduces downtime 30-50%. Supply chain optimization cuts waste. AI-enabled reshoring brings production back to the US.",disruptions:[{area:"Predictive Maintenance",impact:"high",desc:"AI predicting equipment failures before they happen."},{area:"Quality Control",impact:"high",desc:"Computer vision enabling 100% inspection."},{area:"Supply Chain Optimization",impact:"high",desc:"AI managing forecasting, inventory, routing in real time."},{area:"Generative Design",impact:"medium",desc:"AI optimizing product designs, reducing material use."},{area:"Autonomous Robotics",impact:"medium",desc:"Robots adapting to new tasks without reprogramming."}],opportunities:"Industrial AI platforms, digital twins, supply chain tools, robotics-as-a-service.",timeframe:"Accelerating now — major productivity gains by 2027"},{name:"Information & Technology",gdpPct:7.9,disruptionScore:9.8,unemploymentRisk:7.0,gdpImpact:11.0,jobsAtRisk:"2.2",emoji:"\u{1F4BB}",color:"#74B9FF",currentState:"The sector building AI is also most disrupted by it. Software, IT services, data centers — all reshaped from within.",jobsNote:"Junior devs, QA testers, L1/L2 IT support face 40-60% displacement. But also creating the most new AI jobs. Net impact moderate as creation partially offsets losses.",gdpNote:"Biggest GDP winner by far. AI is tech’s product — drives revenue, creates new markets, enables gains across every other sector. Captures disproportionate share of economy-wide AI gains.",disruptions:[{area:"Software Development",impact:"high",desc:"AI coding assistants writing 30-50% of production code."},{area:"IT Operations",impact:"high",desc:"AI agents resolving infrastructure issues autonomously."},{area:"Cybersecurity",impact:"high",desc:"AI vs AI — automated threat detection and response."},{area:"Data & Analytics",impact:"high",desc:"Natural language replacing SQL and BI tools."},{area:"Content & Media",impact:"high",desc:"Marginal cost of digital content approaching zero."}],opportunities:"AI infrastructure, safety tools, vertical applications, developer tooling, AI-native SaaS.",timeframe:"Happening NOW — the epicenter"},{name:"Retail & E-Commerce",gdpPct:5.8,disruptionScore:7.8,unemploymentRisk:7.5,gdpImpact:3.5,jobsAtRisk:"4.0",emoji:"\u{1F6D2}",color:"#FF7675",currentState:"Already transformed by e-commerce. AI is the next wave — personalization, automation, autonomous operations.",jobsNote:"Cashiers, stock clerks, warehouse workers face highest volume of displacement — ng customized content experiences."},{area:"Production & Post",impact:"high",desc:"AI handling VFX, editing, color, sound, dubbing."},{area:"Music & Audio",impact:"high",desc:"AI composing and producing music. Voice cloning."},{area:"Gaming",impact:"medium",desc:"AI generating game worlds, NPC dialogue, assets."}],opportunities:"AI creative tools, synthetic media, IP management, AI-native entertainment formats.",timeframe:"Happening NOW — fastest cultural disruption in history"}];

const calcAgg=()=>{const t=sectors.reduce((s,x)=>s+x.gdpPct,0);const wd=sectors.reduce((s,x)=>s+x.gdpPct*x.disruptionScore/100,0);const hd=sectors.filter(x=>x.disruptionScore>=8).reduce((s,x)=>s+x.gdpPct,0);const tj=sectors.reduce((s,x)=>s+parseFloat(x.jobsAtRisk),0);const te=161.8;const pj=(tj/te)*100;const cr=4.1;const tl=te/(1-cr/100);const cu=(cr/100)*tl;const pu=((cu+tj*0.5)/tl)*100;const wg=sectors.reduce((s,x)=>s+x.gdpPct*x.gdpImpact/100,0);return{avgD:wd/t*100,hdGdp:hd,totGdp:t,tj,te,pj,cr,pu,tl,cu,netGdp:wg/t*100,addU:tj*0.5}};
